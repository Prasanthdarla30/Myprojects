<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style type="text/css">
    @charset "UTF-8";

    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
    }

    .app-title {
        position: absolute;
        top: 20px;
        left: 20px;
        font-size: 24px;
        font-weight: bold;
        color: #333;
    }

    .registration-container {
        background: white;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        width: 320px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h2 {
        margin-bottom: 15px;
        color: #333;
        text-align: center;
    }

    input {
        width: 100%;
        padding: 8px;
        margin: 5px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #273746;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #273746;
    }

    a {
        display: block;
        text-decoration: none;
        color: #007bff;
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
    }

    a:hover {
        text-decoration: underline;
    }
    </style>
</head>
<body>
    <h1 class="app-title">Track & Save</h1>

    <div class="registration-container">
        <h2>User Login</h2>

        <form action="loginservlet" method="post">
            <div>
                <label style="display: block; margin-bottom: 5px;">Username:</label>
                <input type="text" name="username" required>
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px;">Password:</label>
                <input type="password" name="password" required>
            </div>

            <div>
                <button type="submit">Login</button>
            </div>
        </form>

        <div>
            <a href="registration.html">New user? Register here</a>
        </div>
    </div>
</body>
</html>
