<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .project-name {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #273746;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 450px;
            text-align: center;
            margin-top: 50px;
        }

        h2 {
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            text-align: left;
            margin-top: 10px;
        }

        .amount-container {
            position: relative;
        }

        .amount-container::before {
            content: "₹";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            padding: 8px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        input[name="amount"] {
            padding-left: 20px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        .radio-group label,
        .checkbox-group label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            margin-top: 0;
        }

        #addCategory,
        #personDropdown,
        #addPerson,
        #onlineStores {
            margin-top: 5px;
            width: 100%;
        }

        .add-button {
            padding: 5px 10px;
            background-color: #273746;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }

        .add-button:hover {
            background-color: #1C2833;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input[type="file"] {
            padding: 5px;
            margin-bottom: 5px;
        }

        button[type="submit"],
        .view-expense-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            background-color: #273746;
            color: white;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        button[type="submit"]:hover,
        .view-expense-btn:hover {
            background-color: #1C2833;
        }

        br {
            display: none;
        }
    </style>
    <script>
        // Existing functions
        function toggleCategoryInput() {
            var otherCategory = document.getElementById("otherCategory");
            var addCategory = document.getElementById("addCategory");
            var addCategoryBtn = document.getElementById("addCategoryBtn");
            if (otherCategory.checked) {
                addCategory.style.display = "block";
                addCategoryBtn.style.display = "block";
            } else {
                addCategory.style.display = "none";
                addCategoryBtn.style.display = "none";
            }
        }

        function addNewCategory() {
            var newCategory = document.getElementById("addCategory").value;
            if (newCategory) {
                var radioGroup = document.querySelector(".radio-group");
                var newRadio = document.createElement("label");
                newRadio.innerHTML = `<input type="radio" name="category" value="${newCategory}" onclick="toggleCategoryInput()"> ${newCategory}`;
                radioGroup.insertBefore(newRadio, document.getElementById("otherCategory").parentElement);
                document.getElementById("addCategory").value = "";
            }
        }

        function togglePersonDropdown() {
            var expenseOthers = document.getElementById("expenseOthers");
            var personDropdown = document.getElementById("personDropdown");
            var addPerson = document.getElementById("addPerson");
            var addPersonBtn = document.getElementById("addPersonBtn");
            if (expenseOthers.checked) {
                personDropdown.style.display = "block";
                addPerson.style.display = "block";
                addPersonBtn.style.display = "block";
            } else {
                personDropdown.style.display = "none";
                addPerson.style.display = "none";
                addPersonBtn.style.display = "none";
            }
        }

        function addNewPerson() {
            var newPerson = document.getElementById("addPerson").value;
            if (newPerson) {
                var select = document.getElementById("personDropdown");
                var option = document.createElement("option");
                option.value = newPerson;
                option.text = newPerson;
                select.add(option);
                document.getElementById("addPerson").value = "";
            }
        }

        function updatePurchaseType() {
            var onlineCheckbox = document.querySelector('input[name="purchaseType"][value="Online"]');
            var onlineStores = document.getElementById("onlineStores");
            onlineStores.style.display = onlineCheckbox.checked ? "block" : "none";
        }

        function restrictCheckbox(checkbox) {
            var checkboxes = document.querySelectorAll('input[name="purchaseType"]');
            checkboxes.forEach(function(cb) {
                if (cb !== checkbox) {
                    cb.checked = false;
                }
            });
            updatePurchaseType();
        }
        function validateFileSize(event) {
            const maxSize = 10 * 1024 * 1024;
            const receiptInput = document.querySelector('input[name="receipt"]');
            const imageInput = document.querySelector('input[name="itemImage"]');

            if (receiptInput.files && receiptInput.files[0]) {
                const receiptSize = receiptInput.files[0].size;
                if (receiptSize > maxSize) {
                    alert("Receipt file size exceeds 10MB. Please upload a smaller file.");
                    event.preventDefault(); 
                    return false;
                }
            }

            if (imageInput.files && imageInput.files[0]) {
                const imageSize = imageInput.files[0].size;
                if (imageSize > maxSize) {
                    alert("Item image file size exceeds 10MB. Please upload a smaller file.");
                    event.preventDefault();
                    return false;
                }
            }

            return true;
        }
    </script>
</head>
<body>
    <div class="project-name">Track & Save</div>
    <div class="container">
        <h2>Add Expense</h2>
        <!-- Added onsubmit event to call validateFileSize -->
        <form action="AddexpenseServlet" method="POST" enctype="multipart/form-data" onsubmit="return validateFileSize(event)">
            <label>Item Name:</label>
            <input type="text" name="itemName" required>

            <label>Category:</label>
            <div class="radio-group">
                <label><input type="radio" name="category" value="Food" onclick="toggleCategoryInput()"> Food</label>
                <label><input type="radio" name="category" value="Transport" onclick="toggleCategoryInput()"> Transport</label>
                <label><input type="radio" name="category" value="Shopping" onclick="toggleCategoryInput()"> Shopping</label>
                <label><input type="radio" name="category" id="otherCategory" value="Other" onclick="toggleCategoryInput()"> Other</label>
            </div>
            <input type="text" id="addCategory" name="newCategory" placeholder="Enter new category" style="display:none;">
            <button type="button" id="addCategoryBtn" class="add-button" onclick="addNewCategory()" style="display:none;">Add</button>

            <label>Amount:</label>
            <div class="amount-container">
                <input type="number" name="amount" required>
            </div>

            <label>Date:</label>
            <input type="date" name="date" required>

            <label>Payment Mode:</label>
            <select name="paymentMode" required>
                <option value="Cash">Cash</option>
                <option value="Google Pay">Google Pay</option>
                <option value="PhonePe">PhonePe</option>
                <option value="Paytm">Paytm</option>
            </select>

            <label>Expense for:</label>
            <div class="radio-group">
                <label><input type="radio" name="expenseFor" value="Myself" onclick="togglePersonDropdown()"> Myself</label>
                <label><input type="radio" name="expenseFor" id="expenseOthers" value="Others" onclick="togglePersonDropdown()"> Others</label>
            </div>
            <select id="personDropdown" name="personName" style="display:none;">
                <option value="Mother">Mother</option>
                <option value="Father">Father</option>
                <option value="Sister">Sister</option>
            </select>
            <input type="text" id="addPerson" name="newPerson" placeholder="Enter new name" style="display:none;">
            <button type="button" id="addPersonBtn" class="add-button" onclick="addNewPerson()" style="display:none;">Add</button>

            <label>Purchase Type:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="purchaseType" value="Online" onclick="restrictCheckbox(this)"> Online Purchase</label>
                <label><input type="checkbox" name="purchaseType" value="Offline" onclick="restrictCheckbox(this)"> Offline Purchase</label>
            </div>
            <select id="onlineStores" name="onlineStore" style="display:none;">
                <option value="Amazon">Amazon</option>
                <option value="Flipkart">Flipkart</option>
                <option value="Myntra">Myntra</option>
            </select>

            <label>Item Description:</label>
            <textarea name="description" rows="4"></textarea>

            <label>Upload Receipt:</label>
            <input type="file" name="receipt" accept="image/*,application/pdf">

            <label>Upload Item Image:</label>
            <input type="file" name="itemImage" accept="image/*">

            <button type="submit">Add Expense</button>
            <a href="viewexpenses.jsp" class="view-expense-btn">View Expenses</a>
        </form>
    </div>
</body>
</html>
